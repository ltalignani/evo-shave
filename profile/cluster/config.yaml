executor: "slurm"
default-resources:
  slurm_account: "invalbo"
  slurm_partition: "long"
  runtime: 1000
  cpus_per_task: 1
  nodes: 1
  tasks: 1
  mem_mb: max((1.5 * input.size_mb) * attempt, 4000) # see https://snakemake.readthedocs.io/en/v8.4.7/executing/cli.html
jobs: 500
latency-wait: 60
rerun-incomplete: True
use-envmodules: False
use-conda: True
printshellcmds: True
max-jobs-per-second: 5
max-status-checks-per-second: 5
local-cores: 1

# Rules configuration
# Memory floors: to calibrate empirically, run monitor_memory.sh during pipeline execution
# Runtime floors: calibrated from analyze_efficiency.py (P95 × 1.5), run 2026-06-05
set-resources:
  fastqc:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: max((input.size_mb / 1024) * 6 * attempt, 30)
  trimmomatic:
    slurm_partition: "fast"
    cpus_per_task: 8
    mem_mb: max((1.5 * input.size_mb) * attempt, 6000)
    runtime: max((input.size_mb / 1024) * 30 * attempt, 30)  # observed P95: 1.4 min × 1.5
  bwa_mem:
    slurm_partition: "fast"
    cpus_per_task: 16
    mem_mb: max((1.5 * input.size_mb) * attempt, 16000)
    runtime: max((input.size_mb / 1024) * 36 * attempt, 30)  # observed P95: 1.7 min × 1.5
  merge_bams:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: max((input.size_mb / 1024) * 6 * attempt, 30)  # observed P95: 0.3 min × 1.5
  markduplicates_bam:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)  # reduced from 16000; calibrate with monitor_memory.sh
    runtime: max((input.size_mb / 1024) * 18 * attempt, 20)  # observed P95: 0.3 min × 1.5
  samtools_index:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: max((input.size_mb / 1024) * 8 * attempt, 15)  # observed P95: 0.7 min × 1.5
  SetNmMdAndUqTags:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: max((input.size_mb / 1024) * 6 * attempt, 240)
  SetNmMdAndUqTags_index:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: max((input.size_mb / 1024) * 6 * attempt, 120)
  realignertargetcreator:
    slurm_partition: "fast"
    cpus_per_task: 8
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 1024) * 12 * attempt, 240)
  indelrealigner:
    slurm_partition: "long"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 1024) * 60 * attempt, 120)
  sort_by_queryname:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 1024) * 18 * attempt, 40)
  picard_fixmate:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: attempt * 120
  sort_by_coordinate:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: attempt * 180
  validatesam:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: max((input.size_mb / 1024) * 18 * attempt, 60)
  validatesam_HC:
    slurm_partition: "fast"
    cpus_per_task: 2
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)  # reduced from 16000; calibrate with monitor_memory.sh
    runtime: max((input.size_mb / 1024) * 18 * attempt, 15)  # observed P95: 1.2 min × 1.5
  samtools_stats:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: attempt * 120
  samtools_stats_HC:
    slurm_partition: "fast"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: attempt * 20  # observed P95: 1.9 min × 1.5
  qualimap_ug:
    slurm_partition: "fast"
    cpus_per_task: 8
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: attempt * 720
  qualimap_hc:
    slurm_partition: "fast"
    cpus_per_task: 8
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: attempt * 30  # observed P95: 1.4 min × 1.5
  multiqc:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: attempt * 60
  multiqc_HC:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: attempt * 60
  HaplotypeCaller:
    slurm_partition: "long"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)  # reduced from 32000; calibrate with monitor_memory.sh
    runtime: attempt * 30  # observed P95: 0.6 min × 1.5; most scaffolds complete in < 1 min
  HaplotypeCaller_wholegenome:
    slurm_partition: "long"
    cpus_per_task: 4
    mem_mb: max((1.5 * input.size_mb) * attempt, 16000)  # uncalibrated: one job scans the whole genome per sample, not a single scaffold
    runtime: attempt * 720  # uncalibrated starting point (12h); refine once real run times are observed
  unifiedgenotyper:
    slurm_partition: "long"
    cpus_per_task: 8
    mem_mb: max((1.5 * input.size_mb) * attempt, 32000)
    runtime: attempt * 10080
  bgzip:
    slurm_partition: "fast"
    cpus_per_task: 8
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: attempt * 120
  combine_gvcfs:
    slurm_partition: "fast"
    cpus_per_task: 10
    mem_mb: max((1.5 * input.size_mb) * attempt, 16000)
    runtime: attempt * 360
  genomics_db_import:
    slurm_partition: "long"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 32000)  # restored: 95 samples requires ~32 GB
    runtime: attempt * 720  # reduced from 14400; increase if timeouts occur
  genotype_gvcfs:
    slurm_partition: "long"
    cpus_per_task: 6
    mem_mb: max((1.5 * input.size_mb) * attempt, 16000)  # reduced from 128000; calibrate with monitor_memory.sh
    runtime: attempt * 360  # reduced from 2880; not yet observed — increase if timeouts occur
  select_snvs:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 50) * attempt, 60)
  select_indels:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 50) * attempt, 60)
  filter_snvs:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 50) * attempt, 60)
  filter_indels:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 50) * attempt, 60)
  select_pass_snvs:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 50) * attempt, 60)
  select_pass_indels:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 50) * attempt, 60)
  merge_filtered_vcf:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: max((input.size_mb / 50) * attempt, 30)
  report_vcf:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 4000)
    runtime: attempt * 60
  vcf_stats:
    slurm_partition: "fast"
    cpus_per_task: 1
    mem_mb: max((1.5 * input.size_mb) * attempt, 8000)
    runtime: attempt * 240
