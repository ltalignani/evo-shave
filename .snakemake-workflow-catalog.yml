usage:
  mandatory-flags:
    desc: >
      Specify the number of CPU cores to use and enable automatic conda
      environment management. For SLURM cluster execution, use
      `sbatch Start_shave.sh` instead of running Snakemake directly
      (the submission script handles resource allocation, environment
      setup, and job scheduling automatically).
    flags: "--cores 4 --sdm conda"
  software-stack-deployment:
    conda: true         # all tool environments managed via conda
    apptainer: false    # container support not yet implemented
    apptainer+conda: false
    report: true        # snakemake --report report.html is supported
