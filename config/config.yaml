###############################################################################
samples: config/samples.tsv
units: config/units.tsv

resources:
  tmpdir: "/shared/projects/invalbo/tmp/" # Temporary directory (default: '$TMPDIR')
  ## Examples:
  ## '$TMPDIR'  # System variable $TMPDIR (default)
  ## '.'        # Local (i.e. root directory)
  ## '/scratch' # HPC (set it to match your HPC usage)

### TRIMMING --------------------------------------------------------------------------------------
trimmomatic:
  adapters:
    nextera: "resources/adapters/NexteraPE-PE.fa"
    truseq2-pe: "resources/adapters/TruSeq2-PE.fa"
    truseq2-se: "resources/adapters/TruSeq2-SE.fa"
    truseq3-pe: "resources/adapters/TruSeq3-PE.fa"
    truseq3-pe-2: "resources/adapters/TruSeq3-PE-2.fa"
    truseq3-se: "resources/adapters/TruSeq3-SE.fa"
  settings: "ILLUMINACLIP:resources/adapters/TruSeq2-PE.fa:2:30:15 LEADING:20 TRAILING:3 SLIDINGWINDOW:5:20 AVGQUAL:20 MINLEN:50"
  phred: "-phred33"

### REFERENCE ----------------------------------------------------------------------------------------
refs:
  ref_name: "resources/genomes/GCA_018104305.1_AalbF3_genomic.fna" # Path to reference genome
  path: "resources/genomes/" # Path to reference genome directory
  reference: "resources/genomes/GCA_018104305.1_AalbF3_genomic.fna" # Your reference, in fasta format
  ## Available options:
  ## 'resources/genomes/GCA_018104305.1_AalbF3_genomic.fna'                         # AalbF3
  ## 'resources/genomes/AalbF5_filtered.fasta'                                      # AalbF5 filtered (only 4 chroms)
  ## 'resources/genomes/GCF_035046485.1_AalbF5_genomic.fna'                         # AalbF5 complete
  ## 'resources/genomes/Anopheles-gambiae-PEST_CHROMOSOMES_AgamP4.fa'               # AgamP4
  ## 'resources/genomes/mPhoPho1.1_filtered.fasta'                                  # Phocoena phocoena 1.1
  ## 'resources/genomes/mOrcOrc1.1_genomic_filtered.fasta'                          # Orcinus orca 1.1
  index: "resources/genomes/GCA_018104305.1_AalbF3_genomic.fna.fai" # index, obtained with samtools faidx
  dict: "resources/genomes/GCA_018104305.1_AalbF3_genomic.dict" # Dictionary obtained with picard CreateSequenceDictionary

### MARK DUPLICATES ----------------------------------------------------------------------------------------
markdup:
  skip: true # Set to true for ddRAD-seq (reads share coordinates, markdup is unreliable)
  remove-duplicates: false

### GATK ---------------------------------------------------------------------------------------------
enable_variant_calling: true # Set to false to skip variant calling steps
caller: "HaplotypeCaller" # "UnifiedGenotyper" or "HaplotypeCaller"

gatk:
  haplotypecaller: "-ERC GVCF"
  ## Available options:  "-ERC GVCF"                              Emit Ref Confidence scores with condensed non-variants blocks, ie the GVCF format
  ##                     "-ERC BP_RESOLUTION"                     Emit Ref Confidence scores site by site
  output_mode: "EMIT_ALL_CONFIDENT_SITES"
  ##                     "EMIT_VARIANTS_ONLY"       Produces calls only at variant sites
  ##                     "EMIT_ALL_ACTIVE_SITES"    Produces calls at any region over the activity threshold regardless of confidence. This will give a measure of reference confidence and a measure of which alt alleles are more plausible. Inflate VCF size considerably
  ##                     "EMIT_ALL_CONFIDENT_SITES" Produces calls at variant sites and confident reference sites
  genomicsdbimport: ""
  genotypegvcfs: "--include-non-variant-sites"

### CHROMOSOMES --------------------------------------------------------------------------------------
chromosomes:
  auto: true # Set to true to auto-detect contigs from reference .fai (ignores list below)
  min_size: 0 # Minimum contig size in bp — filters out small scaffolds (0 = disabled, requires auto: true)
  pattern: "" # Regex to keep only matching contig names e.g. "^NC_" (empty = disabled, requires auto: true)
  list: # Used when auto: false
    - "NC_085136.1"
    - "NC_085137.1"
    - "NC_085138.1"
    - "NC_006817.1"
  vcf_output: "merged" # "per_contig" | "merged" | "both"
  hc_scatter: true # true = one HaplotypeCaller job per sample per chrom (default, best for few large chromosomes)
                    # false = one HaplotypeCaller job per sample across the whole genome (best for references with many small scaffolds, e.g. hundreds of contigs — avoids per-job scheduling/JVM overhead)

### TRANSFER -----------------------------------------------------------------------------------------
transfer:
  results_dir: "/shared/projects/invalbo/results" # Base destination directory (no trailing slash)
  run_name: "evo-shave" # Prefix for result subfolder — date appended automatically

### VCF FILTERING ------------------------------------------------------------------------------------
filtering:
  skip: true # Set to true for ddRAD-seq (hard filtering thresholds are not appropriate for RADseq data)
  hard:
    # hard filtering as outlined in GATK docs
    # (https://gatkforums.broadinstitute.org/gatk/discussion/2806/howto-apply-hard-filters-to-a-call-set)
    snvs: "QD < 2.0 || FS > 60.0 || MQ < 40.0 || MQRankSum < -12.5 || ReadPosRankSum < -8.0"
    indels: "QD < 2.0 || FS > 200.0 || ReadPosRankSum < -20.0"
